<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixCase · Unión Vital</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
  <link rel="stylesheet" href="css/styles.css?v=2">
  <link rel="stylesheet" href="css/syles2.css?v=1">
<link rel="stylesheet" href="css/dashboard.css?v=2">
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-brand" aria-label="FixCase logo">
        <img src="asset/img/logo.png" alt="FixCase logo" />
      </div>
      <p class="subtitle">Unión Vital · Acceso interno</p>

      <div class="error-box" id="login-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="user">Usuario</label>
          <input type="text" id="user" name="user" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" name="clave" autocomplete="current-password" required>
        </div>
        <button type="submit" class="primary" id="login-btn">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="app-screen">
    <div class="layout">
      <nav class="sidebar">
        <div class="brand-wrap">
          <div class="brand">
            <img src="asset/img/logo_oscuro.png" alt="FixCase logo" />
          </div>
        </div>

        <div class="menu">
          <button class="nav-item active" data-view="dashboard" type="button">
            <span class="material-symbols-outlined" aria-hidden="true">dashboard</span>
            <span>Dashboard</span>
          </button>
          <button class="nav-item" data-view="usuarios" type="button">
            <span class="material-symbols-outlined" aria-hidden="true">group</span>
            <span>Usuarios</span>
          </button>
          <button class="nav-item" data-view="activos" type="button">
            <span class="material-symbols-outlined" aria-hidden="true">precision_manufacturing</span>
            <span>Activos</span>
          </button>
          <button class="nav-item" data-view="dhv" type="button">
            <span class="material-symbols-outlined" aria-hidden="true">badge</span>
            <span>Hojas de Vida</span>
          </button>
          <button class="nav-item" data-view="tareas" type="button">
            <span class="material-symbols-outlined" aria-hidden="true">task_alt</span>
            <span>Tareas</span>
          </button>
          <button class="nav-item" data-view="checklists" type="button">
            <span class="material-symbols-outlined" aria-hidden="true">fact_check</span>
            <span>Checklists</span>
          </button>
          <button class="nav-item" data-view="plantillas" type="button">
            <span class="material-symbols-outlined" aria-hidden="true">description</span>
            <span>Plantillas</span>
          </button>
        </div>

        <div class="spacer"></div>

        <div class="sidebar-footer">
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema" aria-pressed="false">
            <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
            <span class="theme-label">Modo oscuro</span>
            <span class="theme-state">CLARO</span>
          </button>
        </div>

        <button class="nav-item logout" id="logout-btn" type="button">
          <span class="material-symbols-outlined" aria-hidden="true">logout</span>
          <span>Cerrar sesión</span>
        </button>
      </nav>

      <main class="content">
        <h2 id="view-title">Dashboard</h2>
        <p class="view-sub" id="view-sub">Resumen general y métricas del sistema.</p>
        
        <div class="toolbar" id="view-toolbar" style="display:none;">
          <button class="btn-new" id="btn-new">+ Nuevo</button>
        </div>
        
        <div class="panel">
          <div id="view-body">
            <div class="empty-state">Cargando...</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <h3 id="modal-title">Nuevo Registro</h3>
      <p class="modal-sub">Completa los datos correspondientes.</p>

      <div class="error-box" id="modal-error"></div>

      <form id="modal-form">
        <div class="modal-grid" id="modal-fields"></div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modal-cancel">Cancelar</button>
          <button type="submit" class="primary" id="modal-submit" style="width:auto; padding:9px 18px;">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/modules/usuarios.js"></script>
  <script src="js/modules/activos.js"></script>
  <script src="js/modules/dhv.js"></script>
  <script src="js/modules/dhv-list.js"></script>
  <script src="js/modules/tareas.js"></script>
  <script src="js/modules/checklists.js"></script>
  <script src="js/modules/plantillas.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
