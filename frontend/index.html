<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiTIC · Unión Vital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="pulse-wrap" aria-hidden="true">
      <svg viewBox="0 0 120 32">
        <path class="pulse-line" d="M0,16 L30,16 L38,4 L48,28 L56,16 L120,16" />
      </svg>
    </div>
    <h1>MiTIC</h1>
    <p class="subtitle">Unión Vital · acceso interno</p>

    <div class="error-box" id="login-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="user">Usuario</label>
        <input type="text" id="user" name="user" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" autocomplete="current-password" required>
      </div>
      <button type="submit" class="primary" id="login-btn">Ingresar</button>
    </form>
  </div>
</div>

<!-- ===================== DASHBOARD ===================== -->
<div id="app-screen">
  <div class="layout">
    <nav class="sidebar">
      <div class="brand">MiTIC</div>
      <div class="brand-sub">Unión Vital</div>

      <button class="nav-item active" data-view="usuarios">Usuarios</button>
      <button class="nav-item" data-view="activos">Activos</button>
      <button class="nav-item" data-view="tareas">Tareas</button>
      <button class="nav-item" data-view="plantillas">Plantillas</button>

      <div class="spacer"></div>
      <button class="nav-item logout" id="logout-btn">Cerrar sesión</button>
    </nav>

    <main class="content">
      <h2 id="view-title">Usuarios</h2>
      <p class="view-sub" id="view-sub">Listado de usuarios registrados en el sistema.</p>
      <div class="toolbar" id="view-toolbar" style="display:none;">
        <button class="btn-new" id="btn-new">+ Nuevo</button>
      </div>
      <div class="panel">
        <div id="view-body"><div class="empty-state">Cargando...</div></div>
      </div>
    </main>
  </div>
</div>

<!-- ===================== MODAL: Nuevo registro ===================== -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card">
    <h3 id="modal-title">Nuevo Activo</h3>
    <p class="modal-sub">Completá los datos del registro.</p>

    <div class="error-box" id="modal-error"></div>

    <form id="modal-form">
      <div class="modal-grid" id="modal-fields"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="modal-cancel">Cancelar</button>
        <button type="submit" class="primary" id="modal-submit" style="width:auto; padding:9px 18px;">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!--
  Orden de carga (importante, cada archivo depende del anterior):
    1) config.js          -> API_BASE
    2) utils.js           -> escapeHtml, renderTable, formatFecha
    3) modules/*.js       -> usuariosView, activosView, tareasView, plantillasView
    4) auth.js            -> getToken/setToken/clearToken, login, logout
    5) modal.js           -> abrir/cerrar modal, crear registros
    6) app.js             -> junta todo en VIEWS, navegación, arranque
-->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/modules/usuarios.js"></script>
<script src="js/modules/activos.js"></script>
<script src="js/modules/plantillas.js"></script>
<script src="js/modules/tareas.js"></script>
<script src="js/modules/checklists.js"></script> <!-- AGREGAR ESTA LÍNEA -->
<script src="js/auth.js"></script>
<script src="js/modal.js"></script>
<script src="js/app.js"></script>

</body>
</html>
